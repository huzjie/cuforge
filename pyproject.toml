[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cuforge"
version = "0.1.0"
description = "Verifiable task synthesis + online RL for computer-use agents (ScaleCUA)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cuforge contributors" }]
keywords = ["computer-use", "gui-agent", "reinforcement-learning", "grpo", "rlvr", "task-synthesis"]
dependencies = []

[project.optional-dependencies]
serve = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "pydantic>=2.0"]
yaml = ["PyYAML>=6.0"]

[project.scripts]
cuforge = "cuforge.cli.main:main"

[tool.setuptools.packages.find]
include = ["cuforge*"]
